name: Publish Windows installer
on:
  pull_request:
    paths: ['release.json', '.github/workflows/publish.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(python -c "import json; print(json.load(open('release.json'))['version'])")
          printf '%s' "$version" > version.txt
          if gh release view "v$version" >/dev/null 2>&1; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Download and verify installer archive
        if: steps.existing.outputs.exists != 'true' 
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, re, urllib.request, zipfile
          manifest = json.loads(pathlib.Path('release.json').read_text())
          version = manifest['version']
          assert re.fullmatch(r'\d+\.\d+\.\d+', version)
          url = manifest['archive_url']
          assert url.startswith('https://')
          archive = pathlib.Path('installer.zip')
          urllib.request.urlretrieve(url, archive)
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == manifest['archive_sha256'], 'Archive checksum mismatch'
          name = f'DrivePhotoLoader-Setup-{version}.exe'
          out = pathlib.Path('release-files'); out.mkdir()
          with zipfile.ZipFile(archive) as z:
              for filename in (name, 'SHA256SUMS.txt'):
                  (out / filename).write_bytes(z.read(filename))
          checksums = (out / 'SHA256SUMS.txt').read_text(encoding='utf-8-sig')
          expected = next(line.split()[0] for line in checksums.splitlines() if line.split()[-1].lstrip('*') == name)
          payload = (out / name).read_bytes()
          assert payload[:2] == b'MZ'
          assert hashlib.sha256(payload).hexdigest().lower() == expected.lower()
          pathlib.Path('version.txt').write_text(version)
          print('Verified Windows installer:', name)
          PY
      - name: Publish exe and checksum
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          version=$(cat version.txt)
          gh release create "v$version" release-files/*.exe release-files/SHA256SUMS.txt --target "$RELEASE_SHA" --title "Drive Photo Loader $version" --notes "Убрано ожидание полного списка: фото подгружаются порциями по мере обнаружения. Ускорен обход каталогов через метаданные DirEntry. Добавлены живые счётчики найденных и готовых фотографий во время обхода; сохранены остановка, продолжение и ранее подсчитанные файлы."
      - name: Verify anonymous update download
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, urllib.request, urllib.error, time
          base = 'https://api.github.com/repos/Vladart333/qwqwqwq'
          def get(url, binary=False):
              request = urllib.request.Request(url, headers={'User-Agent':'DrivePhotoLoader', 'Accept':'application/octet-stream' if binary else 'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28'})
              for attempt in range(4):
                  try:
                      with urllib.request.urlopen(request, timeout=60) as response:
                          return response.read()
                  except urllib.error.HTTPError as error:
                      print('Anonymous HTTP', error.code, url)
                      if attempt == 3: raise
                      time.sleep(10)
          print('Public repository:', json.loads(get(base))['visibility'])
          version = pathlib.Path('version.txt').read_text()
          release = json.loads(get(base + '/releases/latest'))
          assert release['tag_name'] == 'v' + version
          name = f'DrivePhotoLoader-Setup-{version}.exe'
          assets = {a['name']: a['id'] for a in release['assets']}
          payload = get(base + '/releases/assets/' + str(assets[name]), True)
          assert payload[:2] == b'MZ'
          assert hashlib.sha256(payload).hexdigest() == json.loads(pathlib.Path('release.json').read_text())['installer_sha256']
          checksums = get(base + '/releases/assets/' + str(assets['SHA256SUMS.txt']), True).decode('utf-8-sig')
          assert hashlib.sha256(payload).hexdigest().lower() in checksums.lower()
          print('Anonymous download and SHA256 verified')
          PY
